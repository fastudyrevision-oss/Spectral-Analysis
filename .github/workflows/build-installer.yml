name: Build Installer

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - "v*.*.*"          # v1.1.1 → GitHub Release
    branches:
      - main              # push to main → artifact only, no release
  pull_request:
    branches:
      - main              # PRs → smoke build
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

# Cancel any in-progress run for the same ref (saves runner minutes)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PyInstaller + Inno Setup
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      # Pin to the same minor version you develop on.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # Built-in pip cache — keyed on requirements.txt hash.
          # On a cache hit the "install dependencies" step takes ~5 s.
          cache: "pip"

      # ── 3. Install Python dependencies ─────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0" reportlab

      # ── 4. Cache PyInstaller work directory ───────────────────────────────
      # PyInstaller's analysis phase re-resolves every import on every run.
      # The work/ cache stores the dependency graph and bytecode.
      # A hit reduces the analysis phase from ~8 min to ~2 min.
      - name: Cache PyInstaller workdir
        id: pyi-cache
        uses: actions/cache@v4
        with:
          path: build
          # Invalidate when spec, source, or dependencies change
          key: pyinstaller-${{ runner.os }}-${{ hashFiles('LIBS_Analysis.spec', 'requirements.txt', 'src/**/*.py', 'gui_launcher.py') }}
          restore-keys: |
            pyinstaller-${{ runner.os }}-

      # ── 5. PyInstaller ─────────────────────────────────────────────────────
      # --clean only wipes the temp analysis cache, not the cached build/.
      # We skip --clean when we have a cache hit to keep incremental builds fast.
      - name: Build with PyInstaller (cache miss — full rebuild)
        if: steps.pyi-cache.outputs.cache-hit != 'true'
        run: pyinstaller LIBS_Analysis.spec --clean

      - name: Build with PyInstaller (cache hit — incremental)
        if: steps.pyi-cache.outputs.cache-hit == 'true'
        run: pyinstaller LIBS_Analysis.spec

      # ── 6. Verify EXE ──────────────────────────────────────────────────────
      - name: Verify PyInstaller output
        shell: pwsh
        run: |
          $exe = "dist\LIBS_Analysis\LIBS_Analysis.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "PyInstaller did not produce $exe"
            exit 1
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "✅  LIBS_Analysis.exe  ($mb MB)"

      # ── 7. Install Inno Setup ──────────────────────────────────────────────
      # windows-latest ships with Chocolatey; Inno Setup 6 is ~4 MB.
      # Cache the install so repeated runs don't re-download it.
      - name: Cache Inno Setup
        id: iscc-cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\Inno Setup 6
          key: innosetup-6-windows

      - name: Install Inno Setup (if not cached)
        if: steps.iscc-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Add ISCC to PATH
        shell: pwsh
        run: |
          $dir = "C:\Program Files (x86)\Inno Setup 6"
          echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ── 8. Build installer ─────────────────────────────────────────────────
      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $distDir = "${{ github.workspace }}\dist\LIBS_Analysis"
          $outDir  = "${{ github.workspace }}\installer"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          iscc `
            "/DDistDir=$distDir" `
            "/DOutputDir=$outDir" `
            "libs_spectral_analysis_ci.iss"

          Get-ChildItem $outDir | ForEach-Object {
            $mb = [math]::Round($_.Length / 1MB, 1)
            Write-Host "✅  $($_.Name)  ($mb MB)"
          }

      # ── 9. Verify installer ────────────────────────────────────────────────
      - name: Verify installer output
        shell: pwsh
        run: |
          $setup = Get-ChildItem "installer\*.exe" | Select-Object -First 1
          if (-not $setup) {
            Write-Error "Inno Setup did not produce an installer"
            exit 1
          }
          $mb = [math]::Round($setup.Length / 1MB, 1)
          Write-Host "✅  $($setup.Name)  ($mb MB)"

      # ── 10. Zip portable build ─────────────────────────────────────────────
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\LIBS_Analysis\*" `
            -DestinationPath "installer\LIBS_Analysis_Portable.zip"
          $mb = [math]::Round((Get-Item "installer\LIBS_Analysis_Portable.zip").Length / 1MB, 1)
          Write-Host "✅  LIBS_Analysis_Portable.zip  ($mb MB)"

      # ── 11. Upload artifacts ───────────────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIBS_Spectral_Analysis_Installer
          path: installer/*.exe
          retention-days: 30

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIBS_Analysis_Portable
          path: installer/LIBS_Analysis_Portable.zip
          retention-days: 30

      # ── 12. GitHub Release (tags + manual) ────────────────────────────────
      - name: Should we publish a release?
        id: should_release
        shell: pwsh
        run: |
          $isTag    = "${{ github.ref_type }}" -eq "tag"
          $isManual = "${{ github.event.inputs.create_release }}" -eq "true"
          $publish  = ($isTag -or $isManual).ToString().ToLower()
          echo "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "publish=$publish"

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $ver = (Select-String -Path "libs_spectral_analysis_ci.iss" `
                      -Pattern '#define MyAppVersion\s+"([^"]+)"'
                    ).Matches[0].Groups[1].Value
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "version=$ver"

      - name: Create GitHub Release
        if: steps.should_release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: "LIBS Spectral Analysis v${{ steps.version.outputs.version }}"
          body: |
            ## LIBS Spectral Analysis v${{ steps.version.outputs.version }}

            | File | Description |
            |------|-------------|
            | `LIBS_Spectral_Analysis_Setup_*.exe` | Windows installer — run as Administrator |
            | `LIBS_Analysis_Portable.zip` | No-install portable build |

            **Built from** `${{ github.sha }}`
          files: |
            installer/*.exe
            installer/LIBS_Analysis_Portable.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
